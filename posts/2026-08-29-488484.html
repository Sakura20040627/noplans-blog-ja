<p>一昨日、夫と喧嘩した<br>本当に小さなことだった<br>でも、お互いの習慣や価値観の違いが原因で<br>気づけば6時間以上も喧嘩していた</p>
<p>翌日…<br>雰囲気はいつもの感じに戻っていて<br>夫がわざわざ私のためにご飯を作ってくれた<br>そして「大嫌い！！」と叫びながら<br>これを持ってきた…</p>
